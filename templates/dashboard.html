{% extends "base.html" %}
{% block content %}
<div class="mb-4"><h4 class="fw-bold text-dark">Administrative Dashboard</h4></div>
<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card p-4 bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div><h6 class="text-uppercase small mb-1">Total Patients</h6><h2 class="fw-bold mb-0">{{ patient_count }}</h2></div>
                <i class="fa-solid fa-user-injured fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-4 bg-success text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div><h6 class="text-uppercase small mb-1">Active Doctors</h6><h2 class="fw-bold mb-0">{{ doctor_count }}</h2></div>
                <i class="fa-solid fa-user-md fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-4 bg-warning text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div><h6 class="text-uppercase small mb-1">Staff Registries</h6><h2 class="fw-bold mb-0">{{ user_count }}</h2></div>
                <i class="fa-solid fa-users fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
</div>
{% endblock %}
